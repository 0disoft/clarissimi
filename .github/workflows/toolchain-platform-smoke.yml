name: Toolchain platform smoke

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/toolchain-platform-smoke.yml
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/toolchain-platform-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Validate formatting
        run: pnpm run format

      - name: Validate lint
        run: pnpm run lint

      - name: Verify Action bundle
        run: pnpm run bundle:action:check
